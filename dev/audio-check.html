<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio check</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  button { font: inherit; padding: 12px 16px; margin: 4px 4px 4px 0; border-radius: 8px; border: 0; background: #2d6cdf; color: #fff; }
  button:disabled { background: #444; color: #888; }
  #big { font-size: 40px; font-weight: 600; margin: 12px 0 4px; }
  #status { font-size: 20px; min-height: 1.4em; }
  pre { font-size: 12px; background: #1b1b1b; padding: 8px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  select { font: inherit; padding: 8px; }
</style>
</head>
<body>
<p>SW-49 check (dev only): the audio engine wired to the real scoring. Do, re, mi, re, do.</p>
<label>Do: <select id="do"></select></label>
<div>
  <button id="mic">1. Allow mic</button>
  <button id="give" disabled>2. Give do</button>
  <button id="hint" disabled>Play this note</button>
  <button id="skip" disabled>Skip</button>
</div>
<div id="big">–</div>
<div id="status">Tap "Allow mic".</div>
<pre id="log"></pre>
<script type="module" src="./audio-check.js"></script>
</body>
</html>
