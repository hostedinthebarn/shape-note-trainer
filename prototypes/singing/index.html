<!doctype html>
<!-- PROTOTYPE (SW-37, throwaway): does singing at a phone actually work? Not the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>Singing prototype</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --dim:#888; --ok:#3c6; --warn:#e93; --bad:#e44; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px 16px 40px; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size:14px; color:var(--dim); margin:0 0 8px; font-weight:500; }
  button, select { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid #444; background:#222; color:var(--fg); }
  button.primary { background:#2a4; border-color:#2a4; color:#fff; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; align-items:center; }
  .big { display:flex; align-items:baseline; justify-content:center; gap:10px; margin:10px 0 0; min-height:84px; }
  #deg { font-size:72px; font-weight:700; letter-spacing:1px; }
  #oct { font-size:20px; color:var(--dim); }
  #target { text-align:center; font-size:20px; min-height:28px; }
  .meter { position:relative; height:26px; background:#1c1c1c; border-radius:6px; margin:6px 0; }
  .meter .zone { position:absolute; top:0; bottom:0; background:#1f3a24; }
  .meter .mid { position:absolute; left:50%; top:0; bottom:0; width:2px; background:#555; }
  #needle { position:absolute; top:2px; bottom:2px; width:6px; margin-left:-3px; border-radius:3px; background:var(--fg); left:50%; transition:left 60ms linear; }
  #cents { text-align:center; color:var(--dim); font-variant-numeric:tabular-nums; }
  canvas { width:100%; height:260px; background:#161616; border-radius:8px; display:block; margin-top:8px; }
  details { margin-top:10px; }
  pre { white-space:pre-wrap; font-size:12px; color:#bbb; margin:6px 0; }
  textarea { width:100%; min-height:70px; font:inherit; background:#1a1a1a; color:var(--fg); border:1px solid #444; border-radius:8px; padding:8px; }
  label { color:var(--dim); font-size:13px; }
  #status { color:var(--warn); font-size:13px; min-height:18px; }
</style>
</head>
<body>
<h1>Shape-note singing prototype · SW-37 · throwaway</h1>

<div class="row">
  <button id="start" class="primary">Start audio</button>
  <select id="key"></select>
  <button id="give" disabled>Give do</button>
  <button id="listen" disabled>Listen</button>
  <button id="stop" disabled>Stop mic</button>
</div>
<div class="row">
  <button id="newTarget" disabled>New target</button>
  <label><input type="checkbox" id="arp"> do-mi-sol-do</label>
</div>
<div id="status"></div>

<div id="target"></div>
<div class="big"><span id="deg">–</span><span id="oct"></span></div>
<div class="meter"><div class="zone" id="zone"></div><div class="mid"></div><div id="needle"></div></div>
<div id="cents">cents · Hz · clarity</div>
<canvas id="trace"></canvas>

<details>
  <summary>Settings for the experiments</summary>
  <div class="row">
    <label>Mic during tone
      <select id="micMode">
        <option value="close">close it (recommended)</option>
        <option value="open">keep it open</option>
      </select></label>
    <label><input type="checkbox" id="ec"> echoCancellation</label>
  </div>
  <div class="row">
    <label>Hop <select id="hop"><option>512</option><option>1024</option></select></label>
    <label>Tolerance ± <select id="tol"><option>50</option><option>25</option></select> cents</label>
    <label>audioSession <select id="session"><option value="">(leave)</option><option>playback</option><option>play-and-record</option><option>auto</option></select></label>
  </div>
  <div class="row">
    <button id="suspendResume" disabled>ctx suspend/resume</button>
    <button id="recreate" disabled>Recreate AudioContext</button>
  </div>
</details>

<details open>
  <summary>Numbers</summary>
  <pre id="stats">–</pre>
</details>

<div style="margin-top:10px">
  <textarea id="notes" placeholder="What felt wrong? (goes with the report)"></textarea>
  <div class="row"><button id="send">Send report</button><span id="sent" style="color:var(--dim)"></span></div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
